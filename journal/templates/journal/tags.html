{% extends "journal/layout.html" %}
{% block content %}
<h2 style="margin-bottom:16px">Tags</h2>
<div class="stats">
  <div class="stat"><div class="value">{{ total_tags }}</div><div class="label">Unique Tags</div></div>
  <div class="stat"><div class="value">{{ total_pages }}</div><div class="label">Pages Tagged</div></div>
</div>
<table>
<thead><tr><th>Tag</th><th>Pages</th><th style="width:60%">Distribution</th></tr></thead>
<tbody>
{% for t in tags %}
<tr>
  <td><span class="badge badge-processing">{{ t.tag }}</span></td>
  <td>{{ t.cnt }}</td>
  <td><div class="progress-bar"><div class="progress-fill" style="width:{{ t.pct }}%;background:var(--accent)"></div></div></td>
</tr>
{% endfor %}
</tbody></table>
{% endblock %}
